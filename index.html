<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#e0605e">
<title>Party-Fotos · Aline 40</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📸</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Lobster&family=Oswald:wght@500;600&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  :root { --coral: #e0605e; --teal: #2a8f86; --cream: #f6e7c8; --sand: #efdcb4; --ink: #263238; --sun: #e9b949; }
  * { box-sizing: border-box; }
  html, body { max-width: 100%; overflow-x: hidden; }
  body { margin: 0; min-height: 100vh; font-family: 'Nunito', sans-serif; color: var(--ink);
         background: radial-gradient(circle at 50% -10%, #bfe3ea 0%, #e7eedf 35%, var(--sand) 75%) fixed; }
  .wrap { max-width: 440px; margin: 0 auto; padding: 22px 20px 36px; text-align: center; }

  .poster { display: inline-block; margin: 0 auto; background: var(--cream); padding: 7px;
            border-radius: 10px; transform: rotate(-1.5deg); box-shadow: 0 14px 30px rgba(38,50,56,.28), 0 2px 0 rgba(38,50,56,.1); }
  /* Höhe begrenzt, damit auf dem Handy unter dem Bild schon der Titel hervorschaut */
  .poster img { display: block; width: auto; max-width: min(78vw, 340px); max-height: 54vh; border-radius: 4px; }

  #scrollHint { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); z-index: 10;
                display: flex; align-items: center; gap: 8px; padding: 10px 18px; border: 2px solid var(--ink); border-radius: 30px;
                background: var(--coral); color: #fffaf0; font-family: 'Oswald', sans-serif; font-weight: 600; font-size: 17px;
                letter-spacing: 1px; text-transform: uppercase; box-shadow: 3px 3px 0 var(--ink); cursor: pointer;
                white-space: nowrap; transition: opacity .3s; }
  #scrollHint .arrow { display: inline-block; font-size: 20px; animation: hop 1.1s ease-in-out infinite; }
  #scrollHint.hide { opacity: 0; pointer-events: none; }
  @keyframes hop { 0%, 100% { transform: translateY(-3px); opacity: 1; } 50% { transform: translateY(4px); opacity: .45; } }

  h1 { font-family: 'Lobster', cursive; font-weight: 400; font-size: 46px; line-height: 1; margin: 28px 0 6px;
       color: var(--coral); text-shadow: 2px 2px 0 var(--cream), 4px 4px 0 var(--teal); }
  .sub { font-weight: 700; font-size: 17px; line-height: 1.4; margin: 10px 0 22px; }

  input[type=text] { width: 100%; font: inherit; font-size: 17px; padding: 14px 16px; border: 2px solid var(--ink);
         border-radius: 12px; background: #fffaf0; margin-bottom: 14px; }
  .btn { display: block; width: 100%; font-family: 'Oswald', sans-serif; font-weight: 600; font-size: 22px; letter-spacing: 1.5px;
         text-transform: uppercase; color: #fffaf0; background: var(--coral); border: 2px solid var(--ink); border-radius: 12px;
         padding: 15px; cursor: pointer; box-shadow: 4px 4px 0 var(--ink); transition: transform .08s, box-shadow .08s; }
  .btn:active { transform: translate(3px, 3px); box-shadow: 1px 1px 0 var(--ink); }
  .btn.alt { background: var(--teal); margin-top: 14px; }
  #file { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }

  .status { margin-top: 20px; font-size: 17px; font-weight: 700; min-height: 26px; }
  .bar { height: 12px; background: #fffaf0; border: 2px solid var(--ink); border-radius: 8px; overflow: hidden; margin-top: 10px; display: none; }
  .bar > div { height: 100%; width: 0; background: repeating-linear-gradient(-45deg, var(--coral) 0 10px, var(--sun) 10px 20px); transition: width .3s; }
  .err { color: #b03a2e; }
  .ok { font-size: 60px; margin-top: 6px; }
  .hint { font-size: 14px; opacity: .65; margin-top: 26px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="poster"><img src="poster.jpg" alt="Aline springt am Strand"></div>

  <h1>Party-Fotos</h1>
  <p class="sub">Lade deine Schnappschüsse hoch –<br>sie erscheinen live auf der Leinwand 🌴</p>

  <div id="form">
    <input type="text" id="name" placeholder="Dein Name (freiwillig)" maxlength="30" autocomplete="given-name">
    <label class="btn" for="file" id="pick">Fotos auswählen</label>
    <input type="file" id="file" accept="image/*" multiple aria-label="Fotos auswählen">
  </div>

  <div class="status" id="status"></div>
  <div class="bar" id="bar"><div></div></div>

  <div id="done" style="display:none">
    <div class="ok">🌴🎉</div>
    <p class="sub" id="doneText"></p>
    <button class="btn alt" onclick="reset()">Weitere Fotos</button>
  </div>

  <p class="hint">Keine Anmeldung nötig. Die Fotos sehen nur die Gastgeber und die Leinwand.</p>
</div>

<div id="scrollHint" class="hide" role="button" aria-label="Zum Hochladen nach unten scrollen">
  <span class="arrow">⬇</span> Hier Fotos hochladen <span class="arrow">⬇</span>
</div>

<script>
  // Apps Script, das die Fotos in den Google-Drive-Ordner speichert
  const ENDPOINT = 'https://script.google.com/macros/s/AKfycbwiPq-4urOt75r8lEhIUQ2rUAyn5AHjpSa32THQKYc14KbC8GGg6G4Arz3P1fjfWzEk/exec';
  const MAX = 2048; // längste Seite in Pixel – schnell hochgeladen, scharf auf dem Beamer

  const $ = id => document.getElementById(id);
  try { $('name').value = localStorage.getItem('guestName') || ''; } catch (e) {}

  // Pfeil-Hinweis nur zeigen, solange der Button nicht im Bild ist
  const hint = $('scrollHint');
  hint.addEventListener('click', () => $('pick').scrollIntoView({ behavior: 'smooth', block: 'center' }));
  if ('IntersectionObserver' in window) {
    // Ausblenden, wenn der Button sichtbar ist oder gerade hochgeladen wird / fertig ist
    new IntersectionObserver(([e]) => hint.classList.toggle('hide', e.isIntersecting || $('form').style.display === 'none'),
      { threshold: 0.6 }).observe($('pick'));
  }

  $('file').addEventListener('change', async () => {
    const files = Array.from($('file').files || []);
    if (!files.length) return;
    const name = $('name').value.trim();
    try { localStorage.setItem('guestName', name); } catch (e) {}

    $('form').style.display = 'none';
    hint.classList.add('hide');
    $('bar').style.display = 'block';
    let ok = 0, failed = 0;
    for (let i = 0; i < files.length; i++) {
      setStatus(`Lade Foto ${i + 1} von ${files.length} hoch …`);
      setBar(i / files.length);
      try {
        const dataUrl = await prepare(files[i]);
        await send(dataUrl, name);
        ok++;
      } catch (e) {
        failed++;
        console.error(e);
      }
    }
    setBar(1);
    $('bar').style.display = 'none';
    $('file').value = '';
    if (ok) {
      setStatus(failed ? `<span class="err">${failed} Foto(s) hat es nicht geklappt.</span>` : '');
      $('doneText').textContent = ok === 1 ? 'Danke! Dein Foto ist gleich auf der Leinwand.'
                                           : `Danke! Deine ${ok} Fotos sind gleich auf der Leinwand.`;
      $('done').style.display = 'block';
    } else {
      setStatus('<span class="err">Das hat leider nicht geklappt. Bitte nochmals versuchen.</span>');
      $('form').style.display = 'block';
    }
  });

  function reset() {
    $('done').style.display = 'none';
    $('form').style.display = 'block';
    setStatus('');
    $('file').click();
  }
  function setStatus(html) { $('status').innerHTML = html; }
  function setBar(f) { $('bar').firstElementChild.style.width = Math.round(f * 100) + '%'; }

  // Bild verkleinern und als JPEG kodieren. Klappt das nicht (z. B. HEIC auf Android), Original senden.
  async function prepare(file) {
    try {
      const img = await loadImage(file);
      const scale = Math.min(1, MAX / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * scale);
      c.height = Math.round(img.height * scale);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      return c.toDataURL('image/jpeg', 0.85);
    } catch (e) {
      if (!/^image\//.test(file.type)) throw e;
      return await new Promise((res, rej) => {
        const r = new FileReader();
        r.onload = () => res(r.result);
        r.onerror = rej;
        r.readAsDataURL(file);
      });
    }
  }
  function loadImage(file) {
    return new Promise((res, rej) => {
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => { URL.revokeObjectURL(url); res(img); };
      img.onerror = e => { URL.revokeObjectURL(url); rej(e); };
      img.src = url;
    });
  }

  // Foto an das Apps Script schicken. Bei Netzwerkproblemen bis zu 3 Versuche.
  async function send(dataUrl, name) {
    let lastErr;
    for (let attempt = 1; attempt <= 3; attempt++) {
      try {
        const r = await fetch(ENDPOINT, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // vermeidet CORS-Vorabanfrage
          body: JSON.stringify({ image: dataUrl, name })
        });
        const j = await r.json();
        if (j.ok) return true;
        throw new Error(j.error || 'Unbekannter Fehler');
      } catch (e) {
        lastErr = e;
        if (attempt < 3) await new Promise(res => setTimeout(res, 1500 * attempt));
      }
    }
    throw lastErr;
  }
</script>
</body>
</html>
